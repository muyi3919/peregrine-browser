<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>游隼浏览器</title>
  <link rel="stylesheet" href="browser.css">
</head>
<body>
  <header><span class="brand">游隼</span><span id="environment">浏览器环境</span><span id="region"></span><span id="route"></span><button id="manager" title="回到环境管理">环境管理</button></header>
  <div id="tabs"><div id="tab-list"></div><button id="new-tab" title="新建标签">＋</button></div>
  <nav>
    <button id="back" title="后退">←</button><button id="forward" title="前进">→</button><button id="reload" title="刷新">↻</button>
    <form id="address-form"><span id="lock">◉</span><input id="address" aria-label="网页地址" placeholder="输入网址或搜索关键词" autocomplete="off" spellcheck="false"></form>
    <button id="home" title="起始页">⌂</button>
  </nav>
  <p id="error" role="status"></p>
  <div id="find-bar" hidden><input id="find-text" placeholder="在网页中查找" aria-label="在网页中查找"><button id="find-next" title="下一个">↓</button><button id="find-close" title="关闭查找">×</button></div>
  <script src="browser.js"></script>
</body>
</html>
